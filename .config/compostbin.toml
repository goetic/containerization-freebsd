[host]
clipboard = true

[host.commands.audit]
argv = ["cargo", "audit"]

[host.commands.check]
argv = ["cargo", "check", "--workspace", "--all-targets", "--all-features"]

[host.commands.clippy]
argv = ["cargo", "clippy", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]

[host.commands.fetch-image]
argv = ["bin/dev/fetch-image"]

[host.commands.fmt]
argv = ["cargo", "fmt", "--all"]

# Exact: no arguments, the whole suite.
[host.commands.test]
argv = ["cargo", "nextest", "run"]
tty = true

[host.commands.test-integration]
argv = ["bin/dev/test-integration"]
tty = true

# Widened deliberately, for the iterate-on-one-failing-test loop.
[host.commands.test-one]
arguments = true
argv = ["cargo", "nextest", "run"]
deny = ["--config", "--manifest-path", "-Z", "-p"]
tty = true

[project]
image = "compostbin/base:latest"
name = "cfbsd"
