[host]
clipboard = true

[host.commands.audit]
argv = ["cargo", "audit"]

[host.commands.check]
argv = ["cargo", "check", "--workspace", "--all-targets", "--all-features"]

[host.commands.clippy]
argv = ["cargo", "clippy", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]

[host.commands.fetch-image]
argv = ["bin/dev/fetch-image"]

[host.commands.fmt]
argv = ["cargo", "fmt", "--all"]

# Exact: no arguments, the whole suite.
[host.commands.test]
argv = ["cargo", "nextest", "run"]
tty = true

[host.commands.test-integration]
argv = ["bin/dev/test-integration"]
tty = true

# Widened deliberately, for the iterate-on-one-failing-test loop.
[host.commands.test-one]
arguments = true
argv = ["cargo", "nextest", "run"]
deny = ["--config", "--manifest-path", "-Z", "-p"]
tty = true

[project]
image = "compostbin/base:latest"
name = "cfbsd"

# guest/build-modules, as CI runs it: FreeBSD's make.py (python3) builds bmake
# against libarchive and libbz2, then cross-builds with LLVM 19
# (CROSS_BINDIR=/usr/lib/llvm-19/bin).
[image]
packages = [
    "build-essential",
    "clang-19",
    "file",
    "libarchive-dev",
    "libbz2-dev",
    "lld-19",
    "llvm-19",
    "python3",
]
# guest/build-agent: the toolchain rust-toolchain.toml pins, with the rust-src
# that -Zbuild-std builds FreeBSD's std from.
run = [
    "curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.1 --component rust-src",
]
