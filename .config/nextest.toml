experimental = ["setup-scripts"]

# Setup for the integration suites. fetch-image downloads FreeBSD's image, the
# userland and the pinned bundle once; guest-bundle rebuilds the bundle from
# the working tree on every run.
[scripts.setup.fetch-image]
command = "bin/dev/fetch-image"

[scripts.setup.guest-bundle]
command = "bin/dev/build-guest-bundle"

# While a guest boots, a test's output can close more than nextest's default
# 100ms after the test exits. A real leak still lasts longer than 1s.
[profile.default]
leak-timeout = "1s"

# A stalled boot fails instead of hanging the run. The suite takes about 30s,
# and its own timeouts allow minutes.
[[profile.default.overrides]]
filter = 'package(containerization-freebsd-test)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.default.scripts]]
filter = 'package(containerization-freebsd-test)'
setup = ["fetch-image", "guest-bundle"]
