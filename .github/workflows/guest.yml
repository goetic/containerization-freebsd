# Builds the guest bundle's virtiofs modules for FreeBSD 15.1 arm64, on a
# Linux arm64 runner, through guest/build-modules.
#
# Releases come later: a bundle also carries the agent and its rc.d script,
# and a release is never overwritten, so none is cut without them.

name: guest

on:
  push:
    branches: [main]
    paths:
      - "guest/**"
      - ".github/workflows/guest.yml"
  pull_request:
    paths:
      - "guest/**"
      - ".github/workflows/guest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modules:
    name: virtiofs modules (15.1, arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      LLVM: 19
    steps:
      - uses: actions/checkout@v7

      # The key covers the modules' inputs: the script pins FreeBSD's commit
      # and the patch's sha256. LLVM point releases are excluded.
      - id: cache
        uses: actions/cache@v6
        with:
          path: modules
          key: virtiofs-modules-arm64-llvm${{ env.LLVM }}-${{ hashFiles('guest/build-modules', 'guest/virtiofs-*.patch') }}

      # Same packages as [image] in .config/compostbin.toml.
      - name: Install the build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential file libarchive-dev libbz2-dev python3 \
            "clang-$LLVM" "lld-$LLVM" "llvm-$LLVM"

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: CROSS_BINDIR="/usr/lib/llvm-$LLVM/bin" guest/build-modules "$RUNNER_TEMP/freebsd" modules

      - uses: actions/upload-artifact@v7
        with:
          name: freebsd-15.1-arm64-virtiofs-modules
          path: modules/*.ko
          if-no-files-found: error
