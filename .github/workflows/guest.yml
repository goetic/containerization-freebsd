# Builds the guest bundle for FreeBSD 15.1 arm64 on Linux arm64 runners: the
# virtiofs modules through guest/build-modules, the agent through
# guest/build-agent, and the bundle of both through guest/build-bundle.
#
# Pushing a tag guest-15.1-r<N> publishes that bundle as a GitHub
# pre-release, replacing any earlier one. Releases are never overwritten: a
# tag that already has one fails. Once the integration suite has booted it,
# promote it by hand (`gh release edit <tag> --prerelease=false`).

name: guest

on:
  push:
    branches: [main]
    tags: ["guest-15.1-r*"]
    paths: &inputs
      - "guest/**"
      - "crates/containerization-freebsd-agent/**"
      - "crates/containerization-freebsd-protocol/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/guest.yml"
  pull_request:
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modules:
    name: virtiofs modules (15.1, arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      LLVM: 19
    steps:
      - uses: actions/checkout@v7

      # The key covers the modules' inputs: the script pins FreeBSD's commit
      # and the patch's sha256. LLVM point releases are excluded.
      - id: cache
        uses: actions/cache@v6
        with:
          path: modules
          key: virtiofs-modules-arm64-llvm${{ env.LLVM }}-${{ hashFiles('guest/build-modules', 'guest/virtiofs-*.patch') }}

      # Same packages as [image] in .config/compostbin.toml.
      - name: Install the build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison build-essential file flex libarchive-dev libbz2-dev libssl-dev m4 python3 time zlib1g-dev \
            "clang-$LLVM" "lld-$LLVM" "llvm-$LLVM"

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: CROSS_BINDIR="/usr/lib/llvm-$LLVM/bin" guest/build-modules "$RUNNER_TEMP/freebsd" modules

      - uses: actions/upload-artifact@v7
        with:
          name: freebsd-15.1-arm64-virtiofs-modules
          path: modules/*.ko
          if-no-files-found: error

  agent:
    name: agent (15.1, arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      LLVM: 19
    steps:
      - uses: actions/checkout@v7

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file "clang-$LLVM" "lld-$LLVM"

      # rust-toolchain.toml picks the toolchain; the target's std builds from
      # rust-src.
      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup component add rust-src

      - name: Build
        run: CROSS_BINDIR="/usr/lib/llvm-$LLVM/bin" guest/build-agent "$RUNNER_TEMP/agent" agent

      - uses: actions/upload-artifact@v7
        with:
          name: freebsd-15.1-arm64-agent
          path: agent/containerization-freebsd-agent
          if-no-files-found: error

  bundle:
    name: bundle (15.1, arm64)
    needs: [modules, agent]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: freebsd-15.1-arm64-virtiofs-modules
          path: modules

      - uses: actions/download-artifact@v8
        with:
          name: freebsd-15.1-arm64-agent
          path: agent

      # r<N> from a release tag; otherwise the commit, for bundles that are
      # never released.
      - name: Package
        run: |
          case "$GITHUB_REF" in
            refs/tags/guest-15.1-r*) revision="${GITHUB_REF_NAME#guest-15.1-}" ;;
            *) revision="$(git rev-parse --short HEAD)" ;;
          esac
          guest/build-bundle modules agent/containerization-freebsd-agent "$revision" bundle

      - uses: actions/upload-artifact@v7
        with:
          name: freebsd-15.1-arm64-guest
          path: bundle/*
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/guest-15.1-r')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bundle/* --prerelease \
            --title "Guest bundle $GITHUB_REF_NAME" \
            --notes "The virtiofs modules and the guest agent for FreeBSD 15.1 arm64, built from $GITHUB_SHA."

      # One pre-release at a time: the new one replaces the others. Their
      # tags stay; promoted releases are never touched.
      - name: Delete older pre-releases
        if: startsWith(github.ref, 'refs/tags/guest-15.1-r')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' |
            { grep '^guest-' || true; } |
            while read -r tag; do
              [ "$tag" = "$GITHUB_REF_NAME" ] || gh release delete "$tag" --yes
            done
