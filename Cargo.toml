[workspace.package]
categories = ["virtualization", "os::macos-apis"]
edition = "2024"
keywords = ["freebsd", "virtualization", "macos", "vm", "container"]
license = "MIT"
repository = "https://github.com/goetic/containerization-freebsd"
rust-version = "1.99"

[workspace]
members = [
    "crates/containerization-freebsd",
    "crates/containerization-freebsd-agent",
    "crates/containerization-freebsd-protocol",
    "crates/containerization-freebsd-test",
]
default-members = [
    "crates/containerization-freebsd",
    "crates/containerization-freebsd-agent",
    "crates/containerization-freebsd-protocol",
]
resolver = "3"

[workspace.dependencies]
containerization-freebsd = { path = "crates/containerization-freebsd", version = "0.1.0" }
containerization-freebsd-protocol = { path = "crates/containerization-freebsd-protocol", version = "0.1.0" }
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
virtualization = { version = "0.2.0" }
xz2 = { version = "0.1", features = ["static"] }
