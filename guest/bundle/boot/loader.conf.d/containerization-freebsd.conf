# The guest bundle's patched virtiofs modules, from /boot/modules. fusefs is
# named by path: module_path searches /boot/kernel, with the stock fusefs.ko,
# first. Loading it first also satisfies virtiofs's dependency on it.
fusefs_load="YES"
fusefs_name="/boot/modules/fusefs.ko"
vtfs_load="YES"
virtiofs_load="YES"
